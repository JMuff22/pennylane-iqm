[build-system]
requires = ["setuptools>=68.0.0", "setuptools_scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[project]
name = "pennylane-iqm"
description = "PennyLane device adapter for IQM quantum computers via iqm-client"
authors = [{ name = "Jake Muff", email = "jake.muff@vtt.fi" }]
requires-python = ">=3.11, <3.13"
dynamic = ["version"]
dependencies = [
    "pennylane>=0.40",
    "numpy>=2.0",
    "iqm-client==34.0.3",
    "rustworkx==0.17.1",
]

[project.optional-dependencies]
pulla = [
    "iqm-pulla[notebook]==13.0.3",
]

[tool.setuptools_scm]
# See configuration details in https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"
fallback_version = "0.1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4

target-version = "py311"

[tool.ruff.lint]

ignore = ["F405", "F541", "E501"]

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
]
project-excludes = [
    "tests/**",
    "**/*.ipynb",
]


[tool.ruff.format]
skip-magic-trailing-comma = true
indent-style = "tab"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pyrefly>=0.44.0",
    "pytest>=9.0.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.7",
    "jupyter-client>=8",
    "ipykernel>=6",
    "tox>=4",
    "tox-uv>=1",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "ignore::DeprecationWarning:opentelemetry.util._importlib_metadata",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.vulture]
paths = ["src"]
min_confidence = 80
ignore_names = ["execution_config"]
