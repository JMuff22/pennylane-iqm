[tox]
env_list = ruff, pyrefly, py{311,312}
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
# Wipe IQM credentials -- unit tests must not need real hardware.
setenv =
    IQM_TOKEN =
    IQM_TOKENS_FILE =
commands =
    pytest {posargs}

[testenv:ruff]
description = Lint and format check
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:pyrefly]
description = Static type check
commands =
    pyrefly check
